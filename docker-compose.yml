services:
  api:
    build: .
    image: mlops-app:local
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    image: mlops-app:local
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./k8s/monitoring/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./k8s/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./k8s/monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./k8s/monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./k8s/monitoring/ml-api-dashboard.json:/var/lib/grafana/dashboards/ml-api-dashboard.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
