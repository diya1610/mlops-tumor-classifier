apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops

resources:
  - namespace.yaml
  - api.yaml
  - ui.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=monitoring/prometheus-k8s.yml
      - monitoring/alerts.yml
  - name: grafana-provisioning
    files:
      - datasource.yml=monitoring/grafana-datasource.yml
      - dashboard-provider.yml=monitoring/grafana-dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - monitoring/ml-api-dashboard.json
